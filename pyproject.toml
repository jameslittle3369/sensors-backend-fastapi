[project]
name = "sensors-backend-fastapi"
version = "0.1.0"
description = "FastAPI replacement for the tstats-backend-django service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "libpurecool>=0.6.4",
    "paho-mqtt>=2.1.0",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.34.2",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
